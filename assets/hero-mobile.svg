<svg xmlns="http://www.w3.org/2000/svg" width="400" height="272" viewBox="0 0 400 272" role="img" aria-label="EAM — developer focused on tooling, web systems and automation">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0a0406"/>
      <stop offset=".55" stop-color="#140709"/>
      <stop offset="1" stop-color="#0a0406"/>
    </linearGradient>
    <linearGradient id="mark" x1="0" y1="1" x2="0" y2="0">
      <stop offset="0" stop-color="#b91c1c"/>
      <stop offset=".5" stop-color="#ef4444"/>
      <stop offset="1" stop-color="#fee2e2"/>
    </linearGradient>
    <linearGradient id="rule" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#ef4444" stop-opacity=".8"/>
      <stop offset="1" stop-color="#ef4444" stop-opacity="0"/>
    </linearGradient>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M32 0H0V32" fill="none" stroke="#f43f5e" stroke-opacity=".05" stroke-width="1"/>
    </pattern>
  </defs>

  <rect width="400" height="272" fill="url(#bg)"/>
  <rect width="400" height="272" fill="url(#grid)"/>

  <text x="24" y="96" fill="url(#mark)"
        font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace"
        font-size="68" font-weight="800" letter-spacing="8">EAM</text>

  <rect x="24" y="112" width="44" height="3" rx="1.5" fill="#ef4444"/>

  <text x="24" y="152" fill="#e9c9d0"
        font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace"
        font-size="16">developer — tooling,</text>
  <text x="24" y="176" fill="#e9c9d0"
        font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace"
        font-size="16">web systems · automation</text>

  <text x="24" y="212" fill="#b08b96"
        font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace"
        font-size="13" letter-spacing=".5">github.com/eam-labs</text>

  <rect x="0" y="268" width="400" height="2" fill="url(#rule)"/>
</svg>
