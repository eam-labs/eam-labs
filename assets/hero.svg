<svg xmlns="http://www.w3.org/2000/svg" width="880" height="240" viewBox="0 0 880 240" role="img" aria-label="EAM — developer focused on tooling, web systems and automation">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0a0406"/>
      <stop offset=".55" stop-color="#140709"/>
      <stop offset="1" stop-color="#0a0406"/>
    </linearGradient>
    <linearGradient id="mark" x1="0" y1="1" x2="0" y2="0">
      <stop offset="0" stop-color="#b91c1c"/>
      <stop offset=".5" stop-color="#ef4444"/>
      <stop offset="1" stop-color="#fee2e2"/>
    </linearGradient>
    <linearGradient id="rule" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#ef4444" stop-opacity=".8"/>
      <stop offset="1" stop-color="#ef4444" stop-opacity="0"/>
    </linearGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" fill="none" stroke="#f43f5e" stroke-opacity=".05" stroke-width="1"/>
    </pattern>
  </defs>

  <rect width="880" height="240" fill="url(#bg)"/>
  <rect width="880" height="240" fill="url(#grid)"/>

  <text x="40" y="104" fill="url(#mark)"
        font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace"
        font-size="90" font-weight="800" letter-spacing="14">EAM</text>

  <rect x="40" y="122" width="64" height="3" rx="1.5" fill="#ef4444"/>

  <text x="40" y="170" fill="#e9c9d0"
        font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace"
        font-size="19" letter-spacing=".6">developer — tooling · web systems · automation</text>

  <text x="40" y="204" fill="#b08b96"
        font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace"
        font-size="14" letter-spacing="1">github.com/eam-labs</text>

  <rect x="0" y="238" width="880" height="2" fill="url(#rule)"/>
</svg>
